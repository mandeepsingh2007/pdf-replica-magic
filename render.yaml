# Render Blueprint — https://render.com/docs/blueprint-spec
services:
  - type: web
    name: test-generator-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /health
    envVars:
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: SKIP_IMAGE_EXPAND
        value: "1"
      - key: SKIP_RUNTIME_VLM
        value: "1"
      - key: LLM_MAX_CONCURRENT
        value: "1"
      - key: MAX_LLM_CONTEXT_CHARS
        value: "8000"
      - key: DATABASE_URL
        value: sqlite+aiosqlite:////data/test_generator.db
      - key: GEMINI_API_KEY
        sync: false
      - key: CORS_ORIGINS
        value: '["https://YOUR-APP.vercel.app"]'
